- id: rev_chart_stress
  translation: "金融压力"
- id: rev_chart_stress_desc
  translation: "NFCI 与 STLFSI4（0 = 历史平均）、VIX、高收益债利差，分面展示、共用时间轴。"
- id: rev_chart_stress_note
