- id: outlook_method_vol
  translation: "波动率：直接多步 HAR 模型（Corsi 2009），用日内高低价估计方差，样本外通常优于 GARCH。"
- id: outlook_method_signals
  translation: "信号：美股、港股、商品用 12 个月与 3 个月时间序列动量（Moskowitz-Ooi-Pedersen 2012）；A 股用一周反转（中国市场短期反转显著）加 12 个月动量；VIX 用均值回复。系数符号与理论相反的信号自动关闭（Campbell-Thompson），其余等权组合（Rapach-Strauss-Zhou 2010）。"
- id: outlook_method_dist
  translation: "分布：σ × 实时残差的经验分布（过滤历史模拟），保留厚尾；扇形按 √时间 展开。"
- id: outlook_method_gate
  translation: "上线：2012 年起每周一个起点做实时滚动回测，Brier 技能分 ≥ {{ .Skill }}% 且 Diebold-Mariano 检验 p < {{ .P }} 才显示模型，否则显示基准。约 30 个资产×周期同时检验，个别胜出仍可能出于偶然。"
