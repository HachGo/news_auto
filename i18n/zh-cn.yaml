- id: rev_method_kinds
  translation: "证据分四类：真实观测（直接度量）、代理估算（真实数据近似不可观测的概念）、历史研究示意（研究估算与历史对照视图）、模型预测。图上的标签与数据来源表一致。"
- id: rev_method_index
  translation: "每个成分先换成同比、偏离或水平值，再按扩展窗口标准化（至少 36 个月），截断在 ±4σ；指数 = 50 + 10 × 可得成分 z 值的平均。缺失成分不填补，只降低覆盖率；一个成分都没有的月份不出读数。"
- id: rev_method_asof
  translation: "每个月只使用「观测期末 + 发布滞后 ≤ 月末」的数据，超过各频率时限仍未更新的值视为缺失，因此任一月份的读数都不含未来信息。"
- id: rev_method_forecast
  translation: "不直接预测合成指数（权重是本站自定的，没有可结算的真实目标）。只预测可观测成分：基准为不变预测；模型为直接多步回归 y(t+h) = a + b·y(t)，扩展窗口估计；区间取所用方法过去样本外误差的经验 10% / 90% 分位。"
- id: rev_method_gate
  translation: "上线门槛：样本外点数 ≥ {{ .N }}、MSE 技能分 ≥ {{ .Skill }}%、Diebold-Mariano 单侧 p < {{ .P }}；点数不足时标为「样本不足 · 仅示意」。样本外误差少于 {{ .M }} 个时不给区间。阈值概率的基准是不变预测加其误差分布，而不是无条件发生率。"
- id: rev_method_derived
  translation: "指数的衍生预测：把成分点预测按当前扩展窗口均值与标准差换算成 z 值后按指数规则平均，没有该周期预测的成分按当前值保持（不变预测），覆盖率只统计真正有预测的成分；不单独计分。"
- id: rev_method_ledger
  translation: "每个新起点的预测登记一次（只追加），目标期首次出现真实值时按该值结算一次；之后的修订不改写结算。数据文件按 schema 版本存放（/data/revolution/v1/），清单里带每个文件的哈希。"
