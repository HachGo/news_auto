- id: rev_chart_capex
  translation: "资本投入对比"
- id: rev_chart_capex_desc
  translation: "四大云厂商单季资本开支，以及与互联网投资周期对照的占 GDP 比重。"
- id: rev_chart_capex_note
  translation: "云厂商为季度现金支出 × 4 ÷ 季调年化 GDP，与 BEA 的年化口径对齐；各公司对融资租赁的处理不同。阴影区间为历史对照，不是预测。"
- id: rev_chart_diffusion
  translation: "采用扩散"
- id: rev_chart_diffusion_desc
  translation: "Census BTOS 企业 AI 使用率（新旧两段口径，附 90% 抽样置信带），以及计算机系统设计业就业同比与软件开发岗位发布指数。"
- id: rev_chart_diffusion_note
  translation: "BTOS 于 2025 年 11 月改写题目并增加「不知道」选项，前后两段不可比，不做拼接；竖线为口径变更，中间三期没有发布值。就业与岗位指数是代理指标。"
- id: rev_chart_capability
  translation: "能力与算力"
- id: rev_chart_capability_desc
  translation: "Epoch AI 收录的有训练算力估计的模型（对数刻度），以及前沿（截至当时的最大值）。"
- id: rev_chart_capability_note
  translation: "算力多为研究估算，数据会回溯补录。"
- id: rev_chart_semis
