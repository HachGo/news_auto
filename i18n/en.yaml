- id: rev_method_kinds
  translation: "Four evidence classes: observed (direct measurement), proxy (real data standing in for an unobservable concept), research/illustrative (research estimates and historical comparison views) and model forecast. Chart labels match the source table."
- id: rev_method_index
  translation: "Each component is turned into a growth rate, deviation or level, standardized over an expanding window (at least 36 months) and clipped at ±4σ; index = 50 + 10 × the mean z of available components. Missing components are not filled in, they only lower coverage; months with no components get no reading."
- id: rev_method_asof
  translation: "Each month uses only observations whose period end plus publication lag falls on or before month-end; values older than each frequency's limit count as missing, so no month's reading contains future information."
- id: rev_method_forecast
  translation: "The composite indices are not forecast directly (their weights are defined here and there is no real target to settle against). Only observable components are: the baseline is a no-change forecast; the model is a direct multi-step regression y(t+h) = a + b·y(t) on an expanding window; ranges are the empirical 10% / 90% quantiles of the method's past out-of-sample errors."
- id: rev_method_gate
  translation: "Publishing bar: ≥ {{ .N }} out-of-sample points, MSE skill ≥ {{ .Skill }}% and one-sided Diebold-Mariano p < {{ .P }}; shorter samples are labelled \"too few samples · illustrative\". No range is given with fewer than {{ .M }} out-of-sample errors. The baseline for threshold odds is the no-change forecast plus its error distribution, not the unconditional rate."
- id: rev_method_derived
  translation: "Derived index forecasts convert component point forecasts to z-scores with the current expanding-window mean and standard deviation and average them by the index rule, holding components without a forecast at that horizon at their current value (no change), with coverage counting only components that have a real forecast; they are not scored separately."
- id: rev_method_ledger
  translation: "Each new forecast origin is logged once (append-only) and settled once, against the first value seen for the target period; later revisions do not rewrite it. Data files are stored by schema version (/data/revolution/v1/) with a hash for each file in the manifest."
