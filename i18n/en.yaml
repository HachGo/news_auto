- id: rev_chart_capex_desc
  translation: "Quarterly capex at the four hyperscalers, and investment as a share of GDP compared with the dot-com cycle."
- id: rev_chart_capex_note
  translation: "Hyperscaler share = quarterly cash capex × 4 ÷ seasonally adjusted annualized GDP, matching BEA's annualized basis; companies treat finance leases differently. The shaded period is a historical comparison, not a forecast."
