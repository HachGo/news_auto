- id: outlook_method_title
  translation: "Method and publishing bar"
- id: outlook_method_baseline
  translation: "Baseline: the historical mean of standardized returns (Goyal & Welch 2008 found almost nothing beats it out of sample)."
- id: outlook_method_vol
  translation: "Volatility: a direct multi-step HAR model (Corsi 2009) on high-low range variance, which usually beats GARCH out of sample."
- id: outlook_method_signals
  translation: "Signals: 12- and 3-month time-series momentum for US, Hong Kong and commodities (Moskowitz-Ooi-Pedersen 2012); 1-week reversal plus 12-month momentum for China A-shares, where short-term reversal is strong; mean reversion for VIX. A signal whose fitted sign contradicts theory is switched off (Campbell-Thompson); the rest are averaged (Rapach-Strauss-Zhou 2010)."
- id: outlook_method_dist
  translation: "Distribution: σ times the empirical distribution of real-time residuals (filtered historical simulation), which keeps fat tails; the fan widens with the square root of time."
- id: outlook_method_gate
  translation: "Publishing: weekly walk-forward backtests since 2012. A model is shown only with Brier skill ≥ {{ .Skill }}% and a Diebold-Mariano p < {{ .P }}; otherwise the baseline is shown. About 30 asset-horizon pairs are tested at once, so an occasional win can still be luck."
- id: outlook_home_link
  translation: "Asset outlook"
