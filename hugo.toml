baseURL = "https://hachgo.github.io/news_auto/"
# 中文为默认语言，保持现有网址；英文版在 /en/ 下
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
title = "世界雷达"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "news_auto"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowPageNums = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  hideAuthor = true
  # 每日简报条目多：桌面端右侧目录，小屏默认折叠
  ShowToc = true
  TocOpen = false
  # 归档 / 列表 / 上下篇：覆盖四版面（缺省会只取最大 section）
  mainSections = ["ai", "world", "market", "deep"]
  # 首页“重要事件”默认展示条数（其余点“显示全部”）
  todayEventLimit = 10
  githubURL = "https://github.com/HachGo/news_auto"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.35
    minMatchCharLength = 1
    ignoreLocation = true
    findAllMatches = true
    limit = 50
    keys = ["title", "content", "summary", "permalink"]

  [params.assets]
    disableHLJS = true
    favicon = "favicon.ico"

[languages]
  [languages.zh-cn]
    languageCode = "zh-cn"
    languageName = "中文"
    title = "世界雷达"
    weight = 1
    [languages.zh-cn.params]
      description = "全球新闻按领域整理，附上升信号与趋势研判。"
      keywords = ["AI", "资讯", "国际新闻", "金融市场", "趋势分析", "深度阅读", "每日简报"]
      langLabel = "中文"
      # 版面短名：同日切换、按日归档、搜索结果共用
      [languages.zh-cn.params.sectionShort]
        ai = "AI"
        world = "国际"
        market = "财经"
        deep = "深度"
    [[languages.zh-cn.menus.main]]
      identifier = "today"
      name = "今日"
      pageRef = "/"
      weight = 10
    [[languages.zh-cn.menus.main]]
      identifier = "news"
      name = "新闻"
      pageRef = "/archives"
      weight = 20
    [[languages.zh-cn.menus.main]]
      identifier = "ideas"
      name = "创意"
      pageRef = "/ideas"
      weight = 30
    [[languages.zh-cn.menus.main]]
      identifier = "trends"
      name = "趋势"
      pageRef = "/trends"
      weight = 40
    [[languages.zh-cn.menus.main]]
      identifier = "forecasts"
      name = "预测"
      pageRef = "/forecasts"
      weight = 50

    [[languages.zh-cn.menus.main]]
      identifier = "rules"
      name = "规则"
      pageRef = "/rules"
      weight = 60


  [languages.en]
    languageCode = "en"
    languageName = "English"
    title = "World Radar"
    weight = 2
    [languages.en.params]
      description = "World news organized by field, with rising signals and a trend outlook."
      keywords = ["AI", "world news", "markets", "trend analysis", "long reads", "daily brief"]
      langLabel = "EN"
      [languages.en.params.sectionShort]
        ai = "AI"
        world = "World"
        market = "Finance"
        deep = "Deep"
    [[languages.en.menus.main]]
      identifier = "today"
      name = "Today"
      pageRef = "/"
      weight = 10
    [[languages.en.menus.main]]
      identifier = "news"
      name = "News"
      pageRef = "/archives"
      weight = 20
    [[languages.en.menus.main]]
      identifier = "ideas"
      name = "Ideas"
      pageRef = "/ideas"
      weight = 30
    [[languages.en.menus.main]]
      identifier = "trends"
      name = "Trends"
      pageRef = "/trends"
      weight = 40
    [[languages.en.menus.main]]
      identifier = "forecasts"
      name = "Forecasts"
      pageRef = "/forecasts"
      weight = 50

    [[languages.en.menus.main]]
      identifier = "rules"
      name = "Rules"
      pageRef = "/rules"
      weight = 60


[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
