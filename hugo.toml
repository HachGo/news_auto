baseURL = "https://hachgo.github.io/news_auto/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "每日资讯"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "每日资讯"
  description = "每日自动汇总的 AI、国际、市场与深度阅读精简摘要。"
  keywords = ["AI", "资讯", "国际新闻", "金融市场", "深度阅读", "每日简报"]
  author = "news_auto"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  # 归档 / 首页列表 / 上下篇：覆盖四版面（缺省会只取最大 section）
  mainSections = ["ai", "world", "market", "deep"]

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.35
    minMatchCharLength = 1
    ignoreLocation = true
    findAllMatches = true
    limit = 50
    keys = ["title", "content", "summary", "permalink"]

  [params.homeInfoParams]
    Title = "每日资讯"
    Content = "四版面每日自动汇总：AI与科技、国际资讯、金融市场与股市、深度阅读与学习。"

  [params.assets]
    disableHLJS = true
    favicon = "favicon.ico"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/HachGo/news_auto"

[[params.socialIcons]]
  name = "rss"
  url = "index.xml"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "ai"
    name = "AI"
    url = "/ai/"
    weight = 10
  [[menu.main]]
    identifier = "world"
    name = "国际"
    url = "/world/"
    weight = 20
  [[menu.main]]
    identifier = "market"
    name = "市场"
    url = "/market/"
    weight = 30
  [[menu.main]]
    identifier = "deep"
    name = "深度"
    url = "/deep/"
    weight = 35
  [[menu.main]]
    identifier = "method"
    name = "方法"
    url = "/method/"
    weight = 38
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 40
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
