{{- define "main" }}

<header class="page-header">
    <h1>{{- (printf "%s&nbsp;" .Title ) | htmlUnescape -}}
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
    </h1>
    <div class="post-description">
        {{ .Description | default (i18n "search_default_desc") }}
    </div>
    {{- if not (.Param "hideMeta") }}
    <div class="post-meta">
        {{- partial "translation_list.html" . -}}
    </div>
    {{- end }}
</header>

{{- /* 索引地址按语言给出；搜索脚本打包后中英文共用，不能把地址写死在包里 */}}
<div id="searchbox" class="searchbox" data-index-url="{{ "index.json" | absLangURL }}">
    <input id="searchInput" disabled placeholder="{{ .Params.placeholder | default (i18n "search_placeholder") }}"
        aria-label="{{ i18n "search" }}" aria-describedby="searchStatus" type="search" autocomplete="off" maxlength="128">
    <p id="searchStatus" class="search-status" role="status" aria-live="polite"></p>
    <ul id="searchResults" class="searchResults" aria-label="{{ i18n "search_results" }}"></ul>
</div>

{{- end }}{{/* end main */}}
