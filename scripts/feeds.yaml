  - AI
  - A.I.
  - artificial intelligence
  - machine learning
  - deep learning
  - neural
  - LLM
  - GPT
  - OpenAI
  - Anthropic
  - Claude
  - Gemini
  - DeepSeek
  - Llama
  - Mistral
  - transformer
  - diffusion model
  - AGI
  - chatbot
  - copilot
