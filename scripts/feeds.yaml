    ai_filter: false
    max_items: 8

  # ---------- 市场与宏观 · 财经要闻（section: market） ----------
  # 走 RSS 的财经要闻源（这些站点的可用 RSS；不可用则由抓取失败占位）
  - name: 第一财经要闻
