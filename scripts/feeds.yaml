# RSS 源清单
# section: 归属版面（ai / world / market / deep）
# category: 展示分类
# ai_filter: true 时按 ai_keywords 关键词过滤条目
# block_keywords: 全局屏蔽（标题/摘要命中任一则不入选）
# max_items: 单个源最多取多少条候选

settings:
  total_limit: 15          # 每版面每日最多精选条数（ai/world）
  per_source_limit: 4      # 单来源最多入选条数
  hours_window: 36         # 只取最近 N 小时内发布的条目
  deep_limit: 8            # 「深度阅读」每日最多条数
  deep_per_source_limit: 2 # 「深度阅读」单来源最多条数

feeds:
  # ---------- AI与科技（section: ai） ----------
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    section: ai
    category: AI 动态
    ai_filter: false
    max_items: 10

  - name: The Verge AI
